[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haccp-log"
version = "1.0.0"
description = "Local-first HACCP food-safety logging: time-temperature abuse detection, sanitation checklists, and a tamper-evident SHA-256 audit chain. Pure stdlib, zero runtime deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InGarlicBreadWeTrust" }]
keywords = [
    "haccp", "food-safety", "cold-chain", "audit", "tamper-evident",
    "hash-chain", "temperature", "checklist", "standlib",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["haccp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
