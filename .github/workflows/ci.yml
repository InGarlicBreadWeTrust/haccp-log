name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Byte-compile
        run: python -m compileall haccp tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Import smoke
        run: python -c "import haccp; print(len(haccp.__all__), 'public names loaded')"
